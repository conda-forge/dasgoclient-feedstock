context:
  version: "02.04.54"

package:
  name: dasgoclient
  version: ${{ version }}

source:
  url: https://github.com/dmwm/dasgoclient/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d1f60d7bb39dce6ca079cd0d5ea43be6ead8f0c0de97a7e7337fcd3dc072dae6
  target_directory: src

build:
  number: 0
  script:
    - cd src
    - go-licenses save . --save_path ../library_licenses
    - if: unix
      then:
        - sed -i.bak -e "s,{{VERSION}},v${{ version }},g" main.go && rm main.go.bak
        - go build -v -o $PREFIX/bin/dasgoclient -ldflags="-s -w"
      else:
        - powershell -Command "$content = [System.IO.File]::ReadAllText('main.go').Replace('{{VERSION}}', 'v${{ version }}'); $utf8 = New-Object System.Text.UTF8Encoding $false; [System.IO.File]::WriteAllText('main.go', $content, $utf8)"
        - go build -v -o %LIBRARY_BIN%\dasgoclient.exe -ldflags="-s"
requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script: dasgoclient -help
  - package_contents:
      bin:
        - dasgoclient
      strict: true

about:
  homepage: https://github.com/dmwm/dasgoclient
  summary: Go client for the CMS Data Aggregation System
  description: |
    dasgoclient is the Go implementation of the CMS Data Aggregation System
    (DAS) client. It provides a command-line interface for querying CMS
    data services and returning results in text or JSON formats.
  license: MIT
  license_file:
    - src/LICENSE
    - library_licenses/
  documentation: https://pkg.go.dev/github.com/dmwm/dasgoclient
  repository: https://github.com/dmwm/dasgoclient

extra:
  recipe-maintainers:
    - clelange
